<!DOCTYPE html>
<!--
  GitHub Pages 用の移転ページ。
  LLM Council の画面は Worker から配信するようになった（public/index.html）。
  github.io は他のアプリとオリジンを共有しているため、ここに残っている
  パスワード（localStorage の llm-council-pw）を消してから新しい URL へ案内する。
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LLM Council（移転しました）</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; line-height: 1.7; }
  a { word-break: break-all; }
  textarea { width: 100%; min-height: 160px; box-sizing: border-box; font: inherit; }
  .note { font-size: 0.9em; opacity: 0.75; }
</style>
</head>
<body>
<h1>LLM Council は移転しました</h1>
<p>新しい URL: <a id="new-url" href="https://llm-council-worker.inverted-triangle-leef.workers.dev/">https://llm-council-worker.inverted-triangle-leef.workers.dev/</a></p>
<p id="pw-msg" class="note"></p>

<div id="ctx-box" hidden>
  <p>このブラウザに保存されていた共有コンテキストです。新しい画面には引き継がれないので、必要ならコピーして貼り付けてください。</p>
  <textarea id="ctx" readonly></textarea>
  <p><button id="ctx-clear" type="button">コピーしたので消す</button></p>
</div>

<script>
(function () {
  var PW = "llm-council-pw", CTX = "llm-council-ctx";
  var pwMsg = document.getElementById("pw-msg");
  try {
    var had = localStorage.getItem(PW) !== null;
    localStorage.removeItem(PW);
    pwMsg.textContent = had
      ? "このブラウザに保存されていたパスワードを消しました。新しい画面でもう一度入力してください。"
      : "このブラウザにパスワードは保存されていません。";

    var ctx = localStorage.getItem(CTX);
    if (ctx) {
      document.getElementById("ctx").value = ctx;
      document.getElementById("ctx-box").hidden = false;
      document.getElementById("ctx-clear").addEventListener("click", function () {
        localStorage.removeItem(CTX);
        document.getElementById("ctx-box").hidden = true;
      });
    }
  } catch (e) {
    pwMsg.textContent = "保存データを確認できませんでした（" + e.message + "）。";
  }
})();
</script>
</body>
</html>
