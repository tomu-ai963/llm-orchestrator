name       = "llm-council-worker"
main       = "worker/index.js"
workers_dev = true

# Cloudflare Workers runtime
compatibility_date = "2024-01-01"

# 画面（public/ の中身だけをアップロードする。リポジトリの他のファイルは公開されない）
# run_worker_first: 全リクエストをまず Worker に通し、GET だけ ASSETS に渡す。
# POST / （API）が静的ファイルの index.html に横取りされないようにするため。
[assets]
directory        = "./public"
binding          = "ASSETS"
run_worker_first = true

# KV バインディング（COUNCIL_KV）
[[kv_namespaces]]
binding  = "COUNCIL_KV"
id       = "5fea04bff11f4b1f94d1dae4aa3d816c"
